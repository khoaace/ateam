<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 22l7-13 7 13M12 17h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css?v={{V}}">
<script>
  // theme trước khi vẽ: không nháy trắng
  try { var th = localStorage.getItem("ateam-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  try { if (localStorage.getItem("ateam-side") === "min") document.documentElement.classList.add("side-min"); } catch (e) {}
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 32 32"><path d="M9 22l7-13 7 13M12 17h8"/></svg></div>
      <div class="brand-text">
        <div class="brand-name">ateam</div>
        <button class="brand-proj" id="proj" type="button" data-action="open-project"></button>
      </div>
      <button class="side-toggle" id="side-toggle" type="button" data-action="side-toggle">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/><path class="chev" d="M15.5 10l-2 2 2 2"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group" data-t="nav_g_work"></div>
      <button class="nav-item active" data-view="board">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>
        <span data-t="board"></span><span class="nav-count" id="count-board"></span>
      </button>
      <button class="nav-item" data-view="grid">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>
        <span data-t="grid"></span><span class="nav-count" id="count-grid"></span>
      </button>
      <button class="nav-item" data-view="team">
        <svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4.5V8M9.5 13h.01M14.5 13h.01M9.5 16.5h5M3 12.5v3M21 12.5v3"/><circle cx="12" cy="4" r="1"/></svg>
        <span data-t="team"></span><span class="nav-count" id="count-team"></span>
      </button>
      <button class="nav-item" data-view="custom">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="5" rx="1.5"/><rect x="15" y="4" width="6" height="5" rx="1.5"/><rect x="9" y="15" width="6" height="5" rx="1.5"/><path d="M9 6.5h6M6 9v3.5h6V15M18 9v3.5h-6"/></svg>
        <span data-t="custom"></span>
      </button>
      <button class="nav-item" data-view="skills">
        <svg viewBox="0 0 24 24"><path d="M10 4h4v3a2 2 0 1 0 0 4v0h3v4h-3a2 2 0 1 0-4 0H7v-4a2 2 0 1 0 0-4V4h3z"/></svg>
        <span data-t="skills"></span>
      </button>
      <div class="nav-group" data-t="nav_g_dev"></div>
      <button class="nav-item" data-view="code">
        <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>
        <span data-t="code"></span>
      </button>
      <button class="nav-item" data-view="git">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="9" r="2.4"/><path d="M6 8.4v7.2M18 11.4c0 3-3 3.6-6 4.2-2 .4-4 1-5.6 2.4"/></svg>
        <span data-t="git"></span><span class="nav-count" id="count-git"></span>
      </button>
      <button class="nav-item" data-view="term">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></svg>
        <span data-t="terminal"></span><span class="nav-count" id="count-term"></span>
      </button>
      <div class="nav-group" data-t="nav_g_me"></div>
      <button class="nav-item" data-view="todo">
        <svg viewBox="0 0 24 24"><path d="M4 6.5l1.6 1.6L8.5 5M4 12.5l1.6 1.6 2.9-3.1M4 18.5l1.6 1.6 2.9-3.1M11.5 7h8.5M11.5 13h8.5M11.5 19h8.5"/></svg>
        <span data-t="todo"></span><span class="nav-count" id="count-todo"></span>
      </button>
      <button class="nav-item" data-view="notes">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5"/></svg>
        <span data-t="notes"></span><span class="nav-count" id="count-notes"></span>
      </button>
      <div class="nav-group" data-t="nav_g_stats"></div>
      <button class="nav-item" data-view="dash">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span data-t="dash"></span>
      </button>
    </nav>
    <div class="side-foot">
      <button class="nav-item" data-action="lofi">
        <svg viewBox="0 0 24 24"><path d="M9 17.5V5.5l11-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/></svg>
        <span data-t="lofi"></span>
      </button>
      <button class="nav-item" data-action="phone">
        <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        <span data-t="phone"></span>
      </button>
      <button class="nav-item" data-action="syslog">
        <svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>
        <span data-t="syslog"></span>
      </button>
      <div class="quota" id="quota"></div>
      <div class="conn" id="conn"><span class="dot"></span><span id="conn-text"></span></div>
      <div class="ver" id="ver"></div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="top-left">
        <h1 id="view-title"></h1>
        <div class="chips" id="chips"></div>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" id="btn-pause" data-action="pause"></button>
        <button class="btn ghost sm" data-action="clear" data-t="clear"></button>
        <button class="icon-btn" data-action="rules" id="btn-rules"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7M17 15l2 2 3-4"/></svg></button>
        <button class="icon-btn" data-action="theme" id="btn-theme">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
        </button>
      </div>
    </header>

    <div class="views">
      <section class="view" id="view-board">
        <div id="grill"></div>
        <div id="plan"></div>
        <div class="board-bar" id="board-bar"></div>
        <div class="goals hidden" id="goals"></div>
        <div class="kanban hidden" id="kanban"></div>
        <div class="tboard" id="blist"></div>
      </section>
      <section class="view hidden" id="view-team">
        <div class="team-tools" id="roles-head"></div>
        <div class="ag-list ag-roles" id="team-roles"></div>
        <div class="team-tools ag-sec"><span class="sec-title" data-t="cu_agents"></span><span class="muted small" data-t="ag_hint"></span><span style="flex:1"></span>
          <button class="btn sm primary" data-action="agent-add">+ <span data-t="cu_add_custom_agent"></span></button></div>
        <div class="agent-list" id="team"></div>
      </section>
      <section class="view view-grid hidden" id="view-grid">
        <div class="grid-wrap" id="grid"></div>
      </section>
      <section class="view hidden" id="view-term">
        <div class="term" id="term"></div>
      </section>
      <section class="view hidden" id="view-git">
        <div class="git" id="git"></div>
      </section>
      <section class="view view-code hidden" id="view-code">
        <div class="code" id="code"></div>
      </section>
      <section class="view hidden" id="view-todo">
        <div class="todo" id="todo"></div>
      </section>
      <section class="view hidden" id="view-notes">
        <div class="notes" id="notes"></div>
      </section>
      <section class="view hidden" id="view-dash">
        <div class="dash dash-quota" id="dash-quota"></div>
        <div class="dash" id="dash"></div>
      </section>
      <section class="view hidden" id="view-custom">
        <div class="custom" id="custom"></div>
      </section>
      <section class="view hidden" id="view-skills">
        <div class="skills" id="skills"></div>
      </section>
    </div>

    <footer class="composer">
      <div class="suggest hidden" id="suggest"></div>
      <div class="continue-hint hidden" id="continue-hint"></div>
      <div class="composer-box" id="composer-box">
        <button class="composer-flow" id="flow-pick" type="button" data-action="flow-pick"></button>
        <span class="composer-mode" id="mode"></span>
        <textarea id="input" rows="1" spellcheck="false" autocomplete="off"></textarea>
        <button class="btn primary send" data-action="send" id="send">
          <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
        </button>
      </div>
      <div class="composer-hint"><span id="hint"></span><span class="kbd-hint" id="kbd-hint"></span></div>
    </footer>
  </main>

  <aside class="drawer" id="drawer"></aside>
</div>
<div class="toasts" id="toasts"></div>
<script src="/static/diff.js?v={{V}}"></script>
<script src="/static/git.js?v={{V}}"></script>
<script src="/static/code.js?v={{V}}"></script>
<script src="/static/setup.js?v={{V}}"></script>
<script src="/static/dash.js?v={{V}}"></script>
<script src="/static/quota.js?v={{V}}"></script>
<script src="/static/lofi.js?v={{V}}"></script>
<script src="/static/todo.js?v={{V}}"></script>
<script src="/static/notes.js?v={{V}}"></script>
<script src="/static/grid.js?v={{V}}"></script>
<script src="/static/rules.js?v={{V}}"></script>
<script src="/static/skills.js?v={{V}}"></script>
<script src="/static/app.js?v={{V}}"></script>
</body>
</html>
